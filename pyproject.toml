[project]
name = "barekat-genomics"
version = "0.1.0"
description = "پلتفرم تحلیل داده‌های ژنومی و فارماکوژنومیک"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "psycopg2-binary>=2.9.10",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "celery[redis]>=5.4.0",
    "redis>=5.2.0",
    "boto3>=1.35.0",
    "python-multipart>=0.0.17",
    "python-jose[cryptography]>=3.3.0",
    "cryptography>=43.0.0",
    "passlib[bcrypt]>=1.7.4",
    "httpx>=0.28.0",
    "numpy>=2.1.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.5.0",
    "structlog>=24.4.0",
    "prometheus-client>=0.21.0",
    "sentry-sdk[fastapi,celery]>=2.19.0",
    "fpdf2>=2.8.0",
    "arabic-reshaper>=3.0.0",
    "python-bidi>=0.6.0",
]

[project.optional-dependencies]
bio = [
    "biopython>=1.84",
    "pysam>=0.23.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
]
ml = [
    "xgboost>=2.1.0",
    "shap>=0.44.0",
    "mlflow>=2.14.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=barekat_genomics --cov-report=term-missing --cov-fail-under=70"

[tool.coverage.run]
source = ["barekat_genomics"]
omit = ["*/tests/*"]

[tool.ruff]
line-length = 100
target-version = "py310"
