# Staging overlay — simulated pipeline, no hot-reload, one-click demo stack
services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env.staging
    environment:
      APP_ENV: staging
      DEBUG: "false"
      AUTH_ENABLED: "true"
      PIPELINE_MODE: simulated
      LOG_JSON: "true"
      METRICS_ENABLED: "true"
      AUDIT_LOG_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    volumes:
      - ./data:/data
      - ./dashboard/dist:/app/dashboard/dist:ro
    command: >
      sh -c "alembic upgrade head &&
             uvicorn barekat_genomics.api.main:app --host 0.0.0.0 --port 8000 --workers 2"

  worker:
    build: .
    env_file:
      - .env.staging
    environment:
      APP_ENV: staging
      PIPELINE_MODE: simulated
      PIPELINE_WORK_DIR: /data/processed
      REFERENCE_DIR: /data/reference/GRCh38
      LOG_JSON: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data:/data
    command: celery -A barekat_genomics.tasks.celery_app worker -Q default,urgent --loglevel=info --concurrency=2

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: barekat
      POSTGRES_PASSWORD: barekat_staging
      POSTGRES_DB: barekat_genomics_staging
    ports:
      - "5433:5432"
    volumes:
      - staging_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barekat -d barekat_genomics_staging"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - staging_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    ports:
      - "9010:9000"
      - "9011:9001"
    environment:
      MINIO_ROOT_USER: barekat
      MINIO_ROOT_PASSWORD: barekatstagingsecret
    volumes:
      - staging_minio_data:/data
    command: server /data --console-address ":9001"

volumes:
  staging_postgres_data:
  staging_redis_data:
  staging_minio_data:
