groups:
  - name: barekat-pipeline
    rules:
      - alert: PipelineHighFailureRate
        expr: |
          (
            sum(rate(barekat_pipeline_jobs_total{status="failed"}[10m]))
            /
            sum(rate(barekat_pipeline_jobs_total[10m]))
          ) > 0.1
        for: 5m
        labels:
          severity: critical
          team: bioinformatics
        annotations:
          summary: "Pipeline error rate above 10%"
          description: "More than 10% of pipeline jobs failed in the last 10 minutes."

      - alert: PipelineJobFailed
        expr: increase(barekat_pipeline_jobs_total{status="failed"}[5m]) > 0
        for: 1m
        labels:
          severity: warning
          team: bioinformatics
        annotations:
          summary: "Pipeline failed"
          description: "At least one pipeline job was recorded with status=failed in the last 5 minutes."

      - alert: QCSampleRejected
        expr: increase(barekat_qc_checks_total{result="failed"}[5m]) > 0
        for: 0m
        labels:
          severity: warning
          team: lab
        annotations:
          summary: "Sample rejected in QC"
          description: "At least one sample was rejected in quality control — check the sample and QC parameters."

      - alert: APIUnhealthy
        expr: up{job="barekat-api"} == 0
        for: 2m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "barekat API is unavailable"
          description: "Prometheus cannot scrape the API metrics."

      - alert: PipelineSlowP95
        expr: |
          histogram_quantile(0.95, sum(rate(barekat_pipeline_duration_seconds_bucket[15m])) by (le))
          > 3600
        for: 10m
        labels:
          severity: warning
          team: bioinformatics
        annotations:
          summary: "Slow pipeline — P95 above 1 hour"
          description: "Pipeline run time (P95) has exceeded 3600 seconds."
